<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/search.css">
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <title>Pesquisar Hunter</title>
</head>
<body>
    <aside class="sidebar">
        <div class="logo_imagem">
            <img src="../assets/associação-hunter .png" alt="Logo da associação">
        </div>
        <div class="opcoes">
            <a href="../pages/profile.html"><img src="../assets/profile.png" alt="">PERFIL</a>
            <a href="../pages/search.html"><img src="../assets/search.png" alt="">PESQUISAR</a>
            <a href="../pages/accept_mission.html"><img src="../assets/check.png" alt="">MISSÕES</a>
            <a id="item-dashboard" href="../pages/dashBoard.html"><img src="../assets/dashboard.png" alt="">DASHBOARDS</a>
            <a id="item-criar-missao" class="criar_missao" href="../pages/register_mission.html"><img src="../assets/plus.png" alt="">MISSÕES</a>
        </div>
        <a class="logout" href="../index.html"><img src="../assets/getout.png" alt="">SAIR</a>
    </aside>

    <div class="search_container">
        <div class="search_bar">
            <input type="text" id="pesquisa" placeholder="DIGITE O HUNTER A SER PESQUISADO" onkeypress="teclaEnter(event)">
            <button onclick="pesquisar()">PESQUISAR</button>
        </div>
        <div id="resultado"></div>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
