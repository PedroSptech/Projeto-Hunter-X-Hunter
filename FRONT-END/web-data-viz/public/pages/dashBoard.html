<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/dash.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <title>DashBoard</title>
</head>
<body>
    <aside class="sidebar">
        <div class="logo_imagem">
            <img src="../assets/associação-hunter .png" alt="Logo da associação">
        </div>
        <div class="opcoes">
            <a href="../pages/profile.html"><img src="../assets/profile.png" alt="">PERFIL</a>
            <a href="../pages/search.html"><img src="../assets/search.png" alt="">PESQUISAR</a>
            <a href="../pages/accept_mission.html"><img src="../assets/check.png" alt="">MISSÕES</a>
            <a id="item-dashboard" href="../pages/dashBoard.html"><img src="../assets/dashboard.png"
                    alt="">DASHBOARDS</a>
            <a id="item-criar-missao" class="criar_missao" href="../pages/register_mission.html"><img
                    src="../assets/plus.png" alt="">MISSÕES</a>
        </div>
        <a class="logout" href="../index.html"><img src="../assets/getout.png" alt="">SAIR</a>
    </aside>
    <main class="conteudo-principal">
        <div class="dados">
            <div class="box total_cacadores">
                <h1>TOTAL CAÇADORES:</h1>
                <h2 id="resultado_cacadores"></h2>
            </div>
            <div class="box cacadores_ativo">
                <h1>CAÇADORES ATIVOS:</h1>
                <h2 id="resultado_ativos"></h2>
            </div>
            <div class="box total_missoes">
                <h1>TOTAL MISSÕES:</h1>
                <h2 id="resultado_missoes"></h2>
            </div>
        </div>
    <div class="Charts">

        <div class="bar-chart">
            <h1>QUANTIDADE DE CADA NEN</h1>
            <canvas id="myChart"></canvas>
        </div>

        <div class="donut-chart">
            <h1>STATUS DOS CAÇADORES</h1>
            <canvas id="statusChart"></canvas>
        </div>
        <div class="bar-chart">
            <h1>MISSÕES: GRAU DE DIFICULDADE</h1>
            <canvas id="missoesChart"></canvas>
        </div>
        
        <div class="donut-chart">
            <h1>STATUS DAS MISSÕES</h1>
            <canvas id="statusMissaoChart"></canvas>
        </div> 
        </div>
    </main>

</body>
<script src="../js/sidebar.js"></script>
<script src="../js/script.js"></script>
<script src="../js/dash.js"></script>
<script src="../js/status_dash.js"></script>
<script src="../js/bar_dash.js"></script>
<script src="../js/kpi_dash.js"></script>

</html>
